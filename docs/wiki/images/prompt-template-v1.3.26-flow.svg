<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">Weaverse prompt template data flow</title>
  <desc id="desc">Persisted template controls flow into a single effective instruction stack and then through the shared AI request boundary to every provider.</desc>
  <rect width="1100" height="400" fill="#faf9f7"/>
  <g font-family="Arial, sans-serif">
    <rect x="35" y="58" width="240" height="284" rx="20" fill="#fff" stroke="#d8d3cf" stroke-width="2"/>
    <text x="61" y="94" font-size="21" font-weight="700" fill="#312d2b">TEMPLATE controls</text>
    <text x="61" y="134" font-size="16" fill="#312d2b">1. Mode template</text>
    <text x="61" y="168" font-size="16" fill="#312d2b">2. Selected genres</text>
    <text x="61" y="202" font-size="16" fill="#312d2b">3. Age rating</text>
    <text x="61" y="236" font-size="16" fill="#312d2b">4. Ecchi overlay</text>
    <text x="61" y="286" font-size="14" fill="#756e69">Persisted in DataStore</text>
    <text x="61" y="312" font-size="14" fill="#756e69">Refresh previews the result</text>

    <path d="M295 200h85" stroke="#7556b5" stroke-width="4"/><path d="m368 190 14 10-14 10" fill="none" stroke="#7556b5" stroke-width="4"/>
    <rect x="400" y="94" width="280" height="212" rx="20" fill="#f7f3ff" stroke="#b9a7df" stroke-width="2"/>
    <text x="430" y="132" font-size="21" font-weight="700" fill="#4f3589">Effective instruction stack</text>
    <text x="430" y="174" font-size="15" fill="#312d2b">Global layers applied exactly once</text>
    <text x="430" y="206" font-size="15" fill="#312d2b">Conditional blocks resolved</text>
    <text x="430" y="238" font-size="15" fill="#312d2b">Editable prompt remains reusable</text>
    <text x="430" y="270" font-size="15" fill="#312d2b">Idempotency marker prevents duplicates</text>

    <path d="M700 200h85" stroke="#7556b5" stroke-width="4"/><path d="m773 190 14 10-14 10" fill="none" stroke="#7556b5" stroke-width="4"/>
    <rect x="805" y="58" width="260" height="284" rx="20" fill="#fff" stroke="#d8d3cf" stroke-width="2"/>
    <text x="835" y="96" font-size="21" font-weight="700" fill="#312d2b">Shared AI boundary</text>
    <text x="835" y="140" font-size="16" fill="#312d2b">Novel</text>
    <text x="835" y="172" font-size="16" fill="#312d2b">RPG / Adventure</text>
    <text x="835" y="204" font-size="16" fill="#312d2b">Chatting</text>
    <text x="835" y="236" font-size="16" fill="#312d2b">Storyboard</text>
    <text x="835" y="268" font-size="16" fill="#312d2b">Auxiliary generation</text>
    <text x="835" y="312" font-size="14" fill="#756e69">OpenRouter / OpenAI /</text>
    <text x="835" y="332" font-size="14" fill="#756e69">Anthropic / Gemini</text>
  </g>
</svg>
