name: Beta APK

# Run by hand (Actions → Beta APK → Run workflow) to build a debug APK and commit it to
# beta.test.build/ on the chosen branch, so it can be grabbed straight from the repo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit APK to beta.test.build/
        run: |
          mkdir -p beta.test.build
          cp app/build/outputs/apk/debug/app-debug.apk beta.test.build/weaverse-debug.apk
          sha=$(git rev-parse --short HEAD)
          printf 'Weaverse debug APK\nBuilt from commit %s on %s\n' "$sha" "$(date -u +%Y-%m-%dT%H:%MZ)" > beta.test.build/BUILD-INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f beta.test.build
          git commit -m "Beta APK build from $sha"
          git push
