name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (app)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Unit tests (sync-core)
        run: ./gradlew :sync-core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Package desktop zip
        run: ./gradlew :desktop:packageDesktopZip --stacktrace

      # Short retention on purpose: these artifacts are only for quick per-push CI
      # verification, not distribution (release.yml's GitHub Release does that, as
      # a release asset — which doesn't count against the Actions storage quota).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weaverse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Upload desktop zip
        uses: actions/upload-artifact@v4
        with:
          name: weaverse-desktop-zip
          path: releases/desktop/Weaverse-Desktop-*.zip
          retention-days: 3

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            sync-core/build/reports/tests/
          retention-days: 3
