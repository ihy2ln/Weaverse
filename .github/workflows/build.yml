name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Branch checkout (not the detached merge ref) so the schema step can push back.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests (app)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Unit tests (sync-core)
        run: ./gradlew :sync-core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Room writes app/schemas/<version>.json during compilation. Those files are the record
      # every future migration is written and tested against, so keep them in the repo.
      - name: Save Room database schema
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Save Room database schema"
            git push
          else
            echo "Room schema unchanged"
          fi

      - name: Package desktop zip
        run: ./gradlew :desktop:packageDesktopZip --stacktrace

      # Short retention on purpose: these artifacts are only for quick per-push CI
      # verification, not distribution (release.yml's GitHub Release does that, as
      # a release asset — which doesn't count against the Actions storage quota).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weaverse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Upload desktop zip
        uses: actions/upload-artifact@v4
        with:
          name: weaverse-desktop-zip
          path: releases/desktop/Weaverse-Desktop-*.zip
          retention-days: 3

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            sync-core/build/reports/tests/
          retention-days: 3
