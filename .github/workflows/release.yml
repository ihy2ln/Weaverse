name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create and release (e.g. v0.1.1)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lets this workflow be triggered manually (Actions tab, or the API)
      # without needing a pre-existing tag pushed by hand — the runner's own
      # GITHUB_TOKEN (contents: write, above) creates and pushes it here
      # instead. A `push: tags: [v*]` trigger already has its tag; this step
      # only runs for the workflow_dispatch path.
      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Resolve release tag
        id: tag
        run: echo "name=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # If signing secrets aren't configured, app/build.gradle.kts falls back
      # to the debug signing config automatically, so a release APK is always
      # produced — just not one that can be upgraded in-place over a
      # properly-signed build.
      - name: Determine signing availability
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.has_signing == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/weaverse-release.jks"

      # app/build.gradle.kts reads unprefixed KEYSTORE_PATH / KEYSTORE_PASSWORD /
      # KEY_ALIAS / KEY_PASSWORD (carried over as-is from the transplanted source) —
      # these env var names must match that, not the repo secret names above.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.has_signing == 'true' && format('{0}/weaverse-release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Package desktop zip
        run: ./gradlew :desktop:packageDesktopZip --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          # build.gradle.kts always assigns a signingConfig to the release
          # build type (real keystore, or a fallback to the debug key), so
          # the output is always the signed app-release.apk — never the
          # "-unsigned" variant.
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/weaverse-${{ steps.tag.outputs.name }}.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "dist/weaverse-${{ steps.tag.outputs.name }}-debug-signed.apk"
          fi
          cp releases/desktop/Weaverse-Desktop-*.zip dist/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/*.apk
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Download & test

            ### Android
            Install the APK on an Android device (API 26+).

            ### Windows desktop + web
            Download the `Weaverse-Desktop-*.zip`. Unzip it, run `INSTALL-TO-S.ps1`
            (or copy the folder wherever you like), then double-click `Weaverse.exe`
            (or `START-DESKTOP.bat`) — needs Java 17+ unless you use the full
            Windows package. It opens the web hub, which shows the one sync
            password. On Android: **Settings → Open web sync** → enter that
            password → Push / Pull.

            See `Weaverse/SYNC.md` for details.

            ### iOS (early walking skeleton — not the full app yet)
            Download `Weaverse-iOS-Simulator-*.zip` and upload it to
            [appetize.io](https://appetize.io) as an iOS app — it's a Simulator
            build (no code signing needed) that confirms the Kotlin↔Swift
            pipeline works, not a ported version of the Android app. See
            `docs/features/ios-port-plan.md` for status and what's next. This
            asset is only attached once the `ios-simulator-build` job below
            finishes — it can lag a few minutes behind the Android/Desktop
            assets above since macOS runners are slower.

  ios-simulator-build:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Cheaper, earlier failure point than the full Xcode build below — see
      # ios-build.yml, which this job mirrors (kept separate so day-to-day
      # iOS iteration doesn't have to wait for a full Android+Desktop release
      # cycle; this copy is what actually publishes to the Release page).
      - name: Compile shared module for iOS Simulator (arm64)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Build iOS app for Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate and zip the .app bundle
        run: |
          APP_PATH=$(find build/ios -name "iosApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "iosApp.app not found under build/ios" >&2
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Weaverse-iOS-Simulator-${{ needs.release.outputs.tag_name }}.zip"

      # No body/generate_release_notes here — the release job already created
      # the release with its own body; omitting these leaves that text alone
      # and just adds this file to the same tag's asset list.
      - name: Attach iOS Simulator build to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: dist/*.zip
