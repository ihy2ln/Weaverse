name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create and release (e.g. v0.1.1)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lets this workflow be triggered manually (Actions tab, or the API)
      # without needing a pre-existing tag pushed by hand — the runner's own
      # GITHUB_TOKEN (contents: write, above) creates and pushes it here
      # instead. A `push: tags: [v*]` trigger already has its tag; this step
      # only runs for the workflow_dispatch path.
      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Resolve release tag
        id: tag
        run: echo "name=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # If signing secrets aren't configured, app/build.gradle.kts falls back
      # to the debug signing config automatically, so a release APK is always
      # produced — just not one that can be upgraded in-place over a
      # properly-signed build.
      - name: Determine signing availability
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.has_signing == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/weaverse-release.jks"

      # app/build.gradle.kts reads unprefixed KEYSTORE_PATH / KEYSTORE_PASSWORD /
      # KEY_ALIAS / KEY_PASSWORD (carried over as-is from the transplanted source) —
      # these env var names must match that, not the repo secret names above.
      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.has_signing == 'true' && format('{0}/weaverse-release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Package desktop zip
        run: ./gradlew :desktop:packageDesktopZip --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          # build.gradle.kts always assigns a signingConfig to the release
          # build type (real keystore, or a fallback to the debug key), so
          # the output is always the signed app-release.apk — never the
          # "-unsigned" variant.
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/weaverse-${{ steps.tag.outputs.name }}.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "dist/weaverse-${{ steps.tag.outputs.name }}-debug-signed.apk"
          fi
          cp releases/desktop/Weaverse-Desktop-*.zip dist/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/*.apk
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Download & test

            ### Android
            Install the APK on an Android device (API 26+).

            ### Windows desktop + web
            Download the `Weaverse-Desktop-*.zip`. Unzip it, run `INSTALL-TO-S.ps1`
            (or copy the folder wherever you like), then double-click `Weaverse.exe`
            (or `START-DESKTOP.bat`) — needs Java 17+ unless you use the full
            Windows package. It opens the web hub, which shows the one sync
            password. On Android: **Settings → Open web sync** → enter that
            password → Push / Pull.

            See `Weaverse/SYNC.md` for details.

            ### iOS
            Paused — see `docs/features/ios-port-plan.md`. Not built or
            attached to this release until real device testing is available.
