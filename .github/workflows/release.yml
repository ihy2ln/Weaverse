name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # If signing secrets aren't configured, app/build.gradle.kts falls back
      # to the debug signing config automatically, so a release APK is always
      # produced — just not one that can be upgraded in-place over a
      # properly-signed build.
      - name: Determine signing availability
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.has_signing == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/weaverse-release.jks"

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace
        env:
          WEAVERSE_KEYSTORE_PATH: ${{ steps.signing.outputs.has_signing == 'true' && format('{0}/weaverse-release.jks', runner.temp) || '' }}
          WEAVERSE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WEAVERSE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WEAVERSE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p dist
          # build.gradle.kts always assigns a signingConfig to the release
          # build type (real keystore, or a fallback to the debug key), so
          # the output is always the signed app-release.apk — never the
          # "-unsigned" variant.
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/weaverse-${{ github.ref_name }}.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "dist/weaverse-${{ github.ref_name }}-debug-signed.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
